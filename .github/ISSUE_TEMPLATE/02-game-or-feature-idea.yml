name: Game or feature idea
description: Suggest a new game booth or a change to the midway, written so someone can pick it up and finish it.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Say what you want and how you'll know it's done. Keep it to one change:
        one new game, or one change to the midway or a game.
  - type: textarea
    id: what
    attributes:
      label: What should change?
      description: What a player would see or be able to do once it's done.
      placeholder: Add a hook-a-duck booth where you hook ducks as they float past.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where, if you know
      description: A game, a file or a part of the midway. Leave it blank if you're not sure.
      placeholder: A new folder in src/games/
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A short checklist to test the work against.
      value: |
        - [ ]
        - [ ] `npm run check` passes
    validations:
      required: true
